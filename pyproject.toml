[project]
name = "skiptts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ioSquishy", email = "111015917+ioSquishy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.2.0",
    "kokoro>=0.9.4",
    "pandas>=3.1.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "spacy>=3.8.18",
]

[project.scripts]
skiptts = "skiptts:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
